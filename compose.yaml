# Local development stack. Bring-up order follows docs/IMPLEMENTATION_GUIDE.md §3:
#   postgres → migrations → object storage → airflow → domain-api → web → ...
# Services are added incrementally as each phase lands.

name: dramamemory

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-dramamemory}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dramamemory}
  POSTGRES_DB: ${POSTGRES_DB:-dramamemory}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      <<: *postgres-env
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies db/migrations/*.sql once and exits. Re-run with `docker compose run --rm migrate`.
  migrate:
    image: flyway/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramamemory}
      -user=${POSTGRES_USER:-dramamemory}
      -password=${POSTGRES_PASSWORD:-dramamemory}
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the raw snapshot bucket once and exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${RAW_BUCKET:-dramamemory-raw}
      "

volumes:
  postgres-data:
  minio-data:
