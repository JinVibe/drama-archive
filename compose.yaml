# Local development stack. Bring-up order follows docs/IMPLEMENTATION_GUIDE.md §3:
#   postgres → migrations → object storage → airflow → domain-api → web → ...
# Services are added incrementally as each phase lands.

name: dramamemory

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-dramamemory}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dramamemory}
  POSTGRES_DB: ${POSTGRES_DB:-dramamemory}

x-airflow-common: &airflow-common
  image: apache/airflow:3.3.0-python3.12
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-dramamemory}:${POSTGRES_PASSWORD:-dramamemory}@postgres:5432/${AIRFLOW_DB:-airflow}
    # Local-only: no login screen. Production uses a real auth manager.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-only-jwt-secret}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Pipeline code is importable from DAGs without packaging.
    PYTHONPATH: /opt/airflow/src
    # Connections used by DAGs (docs/AIRFLOW_DAGS.md). Same names in every environment.
    AIRFLOW_CONN_DRAMAMEMORY_POSTGRES: postgresql://${POSTGRES_USER:-dramamemory}:${POSTGRES_PASSWORD:-dramamemory}@postgres:5432/${POSTGRES_DB:-dramamemory}
    AIRFLOW_CONN_DRAMAMEMORY_S3: '{"conn_type":"aws","login":"${S3_ACCESS_KEY:-dramamemory}","password":"${S3_SECRET_KEY:-dramamemory}","extra":{"endpoint_url":"http://objectstore:9000","region_name":"us-east-1"}}'
    DRAMAMEMORY_RAW_BUCKET: ${RAW_BUCKET:-dramamemory-raw}
  volumes:
    - ./data-platform/dags:/opt/airflow/dags
    - ./data-platform/src:/opt/airflow/src
    - ./data-platform/logs:/opt/airflow/logs
    - ./data-platform/config:/opt/airflow/config:ro
    - ./data-platform/manifests:/opt/airflow/manifests:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      <<: *postgres-env
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies db/migrations/*.sql once and exits. Re-run with `docker compose run --rm migrate`.
  migrate:
    image: flyway/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramamemory}
      -user=${POSTGRES_USER:-dramamemory}
      -password=${POSTGRES_PASSWORD:-dramamemory}
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for raw snapshots (local only; production uses S3).
  # RustFS replaces MinIO, whose public images are no longer distributed.
  objectstore:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-dramamemory}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-dramamemory}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates the raw snapshot bucket once and exits.
  objectstore-init:
    image: amazon/aws-cli:latest
    depends_on:
      objectstore:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-dramamemory}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-dramamemory}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >
      -c "aws --endpoint-url http://objectstore:9000 s3api head-bucket --bucket ${RAW_BUCKET:-dramamemory-raw} 2>/dev/null
      || aws --endpoint-url http://objectstore:9000 s3 mb s3://${RAW_BUCKET:-dramamemory-raw}"

  domain-api:
    build: ./apps/domain-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramamemory}
      DB_USER: ${POSTGRES_USER:-dramamemory}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dramamemory}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:-local-dev-only-session-secret-change-me-0000}
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "${DOMAIN_API_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./apps/web
    environment:
      DOMAIN_API_URL: http://domain-api:8081
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      domain-api:
        condition: service_healthy

  # Serves curated seed JSON to the local_seed ingestion source (local only).
  seed:
    image: nginx:1.27-alpine
    volumes:
      - ./data-platform/seed:/usr/share/nginx/html:ro
      - ./data-platform/config/seed-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/dramas/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Airflow 3 (LocalExecutor). Metadata DB = "airflow" database in the same
  # postgres instance; pipeline code writes to the "dramamemory" database
  # through the connections below. Airflow never sits on the request path.
  # ---------------------------------------------------------------------------
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Runs metadata migrations and (re)declares pools once, then exits.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow pools import /opt/airflow/config/pools.json"
    depends_on:
      postgres:
        condition: service_healthy

  # One-off CLI: `docker compose run --rm airflow-cli dags list`
  airflow-cli:
    <<: *airflow-common
    profiles: [cli]
    entrypoint: airflow
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  objectstore-data:
