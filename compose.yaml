# Local development stack. Bring-up order follows docs/IMPLEMENTATION_GUIDE.md §3:
#   postgres → migrations → object storage → airflow → domain-api → web → ...
# Services are added incrementally as each phase lands.

name: dramamemory

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-dramamemory}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dramamemory}
  POSTGRES_DB: ${POSTGRES_DB:-dramamemory}

x-airflow-common: &airflow-common
  build: ./data-platform          # apache/airflow:3.3.0-python3.12 + neo4j driver
  image: dramamemory/airflow:local
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    DRAMAMEMORY_NEO4J_URI: bolt://neo4j:7687
    DRAMAMEMORY_NEO4J_USER: neo4j
    DRAMAMEMORY_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dramamemory-neo4j}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-dramamemory}:${POSTGRES_PASSWORD:-dramamemory}@postgres:5432/${AIRFLOW_DB:-airflow}
    # Local-only: no login screen. Production uses a real auth manager.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-only-jwt-secret}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Pipeline code is importable from DAGs without packaging.
    PYTHONPATH: /opt/airflow/src
    # Connections used by DAGs (docs/AIRFLOW_DAGS.md). Same names in every environment.
    AIRFLOW_CONN_DRAMAMEMORY_POSTGRES: postgresql://${POSTGRES_USER:-dramamemory}:${POSTGRES_PASSWORD:-dramamemory}@postgres:5432/${POSTGRES_DB:-dramamemory}
    AIRFLOW_CONN_DRAMAMEMORY_S3: '{"conn_type":"aws","login":"${S3_ACCESS_KEY:-dramamemory}","password":"${S3_SECRET_KEY:-dramamemory}","extra":{"endpoint_url":"http://objectstore:9000","region_name":"us-east-1"}}'
    DRAMAMEMORY_RAW_BUCKET: ${RAW_BUCKET:-dramamemory-raw}
    # embedding_refresh DAG calls ai-api so the model lives in exactly one process.
    DRAMAMEMORY_AI_API_URL: http://ai-api:8090
    DRAMAMEMORY_AI_API_TOKEN: ${AI_API_INTERNAL_TOKEN:-local-dev-internal-token}
  volumes:
    - ./data-platform/dags:/opt/airflow/dags
    - ./data-platform/src:/opt/airflow/src
    - ./data-platform/logs:/opt/airflow/logs
    - ./data-platform/config:/opt/airflow/config:ro
    - ./data-platform/manifests:/opt/airflow/manifests:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      <<: *postgres-env
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies db/migrations/*.sql once and exits. Re-run with `docker compose run --rm migrate`.
  migrate:
    image: flyway/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramamemory}
      -user=${POSTGRES_USER:-dramamemory}
      -password=${POSTGRES_PASSWORD:-dramamemory}
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Derived graph read model (docs/GRAPH_MODEL.md). Re-creatable from PostgreSQL by the
  # graph_materialization DAG, so its volume is disposable.
  neo4j:
    image: neo4j:2026.01
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-dramamemory-neo4j}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-dramamemory-neo4j} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  # S3-compatible object storage for raw snapshots (local only; production uses S3).
  # RustFS replaces MinIO, whose public images are no longer distributed.
  objectstore:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-dramamemory}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-dramamemory}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates the raw snapshot bucket once and exits.
  objectstore-init:
    image: amazon/aws-cli:latest
    depends_on:
      objectstore:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-dramamemory}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-dramamemory}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >
      -c "aws --endpoint-url http://objectstore:9000 s3api head-bucket --bucket ${RAW_BUCKET:-dramamemory-raw} 2>/dev/null
      || aws --endpoint-url http://objectstore:9000 s3 mb s3://${RAW_BUCKET:-dramamemory-raw}"

  domain-api:
    build: ./apps/domain-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dramamemory}
      DB_USER: ${POSTGRES_USER:-dramamemory}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dramamemory}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:-local-dev-only-session-secret-change-me-0000}
      SESSION_COOKIE_SECURE: "false"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
    ports:
      - "${DOMAIN_API_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-api:
    build: ./apps/ai-api
    environment:
      AI_API_DB_URL: postgresql://${POSTGRES_USER:-dramamemory}:${POSTGRES_PASSWORD:-dramamemory}@postgres:5432/${POSTGRES_DB:-dramamemory}
      AI_API_EMBEDDER: ${AI_API_EMBEDDER:-bge}
      AI_API_INTERNAL_TOKEN: ${AI_API_INTERNAL_TOKEN:-local-dev-internal-token}
      AI_API_NEO4J_URI: bolt://neo4j:7687
      AI_API_NEO4J_USER: neo4j
      AI_API_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dramamemory-neo4j}
      # "bge" loads BAAI/bge-reranker-v2-m3 (~1.1 GB) for ?rerank=true; off by default (DM-605)
      AI_API_RERANKER: ${AI_API_RERANKER:-none}
    ports:
      - "${AI_API_PORT:-8090}:8090"
    volumes:
      - hf-models:/models   # BGE-M3 weights, downloaded once
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8090/health/ready')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  mcp-server:
    build: ./apps/mcp-server
    environment:
      MCP_DOMAIN_API_URL: http://domain-api:8081
      MCP_AI_API_URL: http://ai-api:8090
      MCP_WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
    ports:
      - "${MCP_PORT:-8100}:8100"
    depends_on:
      domain-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8100/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build: ./apps/web
    environment:
      DOMAIN_API_URL: http://domain-api:8081
      AI_API_URL: http://ai-api:8090
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      domain-api:
        condition: service_healthy

  # Serves curated seed JSON to the local_seed ingestion source (local only).
  seed:
    image: nginx:1.27-alpine
    volumes:
      - ./data-platform/seed:/usr/share/nginx/html:ro
      - ./data-platform/config/seed-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/dramas/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Airflow 3 (LocalExecutor). Metadata DB = "airflow" database in the same
  # postgres instance; pipeline code writes to the "dramamemory" database
  # through the connections below. Airflow never sits on the request path.
  # ---------------------------------------------------------------------------
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Runs metadata migrations and (re)declares pools once, then exits.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow pools import /opt/airflow/config/pools.json"
    depends_on:
      postgres:
        condition: service_healthy

  # One-off CLI: `docker compose run --rm airflow-cli dags list`
  airflow-cli:
    <<: *airflow-common
    profiles: [cli]
    entrypoint: airflow
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  objectstore-data:
  hf-models:
  neo4j-data:
