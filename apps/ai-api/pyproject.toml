[project]
name = "dramamemory-ai-api"
version = "0.1.0"
description = "DramaMemory AI Query Service: hybrid retrieval (lexical + vector, RRF), embeddings, later RAG/GraphRAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "neo4j>=5.28",
]

[project.optional-dependencies]
# The real embedder. Heavy (torch); the Docker image installs it, unit tests do not need it.
embed = [
    "sentence-transformers>=3.3",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI dependency injection idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Cypher text blocks are clearer unwrapped.
"src/ai_api/graph/queries.py" = ["E501"]
