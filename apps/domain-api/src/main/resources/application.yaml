spring:
  application:
    name: domain-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dramamemory}
    username: ${DB_USER:dramamemory}
    password: ${DB_PASSWORD:dramamemory}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  # Schema is applied by the compose `migrate` service / CI before this app starts.
  flyway:
    enabled: false
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8081}

dramamemory:
  admin:
    # Shared secret for /api/v1/admin/* (X-Admin-Token). Empty disables the admin API.
    token: ${ADMIN_TOKEN:}
  session:
    cookie-name: dm_uid
    # >= 32 bytes. Rotating it logs every browser out. Never use the default outside local dev.
    cookie-secret: ${SESSION_COOKIE_SECRET:local-dev-only-session-secret-change-me-0000}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    cookie-max-age: 365d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
